[package]
name = "ghostsignals"
version = "0.2.0"
edition = "2021"
description = "Prediction markets as collective intelligence using LMSR"
license = "MIT"
repository = "https://github.com/NickFlach/ghostsignals-rs"
keywords = ["prediction-markets", "lmsr", "trading", "collective-intelligence"]
categories = ["algorithms", "finance"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"

[dev-dependencies]
approx = "0.5"
proptest = "1.5"
serde_json = { version = "1.0", features = ["float_roundtrip"] }
